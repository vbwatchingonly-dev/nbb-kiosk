<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>노브랜드 버거 KIOSK</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans KR & Black Han Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nbb: {
                            yellow: '#FFC700',
                            yellowDark: '#E6B200',
                            black: '#111111',
                            dark: '#1C1C1C',
                            gray: '#F4F4F5',
                            accent: '#D92525'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                        impact: ['"Black Han Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fff7d4;
            color: #171717;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #fff8dc;
        }
        ::-webkit-scrollbar-thumb {
            background: #e6b600;
            border-radius: 4px;
        }

        .touch-active:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .kiosk-frame {
            max-width: 500px;
            height: min(940px, 100dvh);
            min-height: 640px;
            border-color: #ffc700 !important;
            box-shadow: 0 20px 70px #a9851d26 !important;
        }

        #screenWelcome {
            background: #fffdf5;
        }

        .brand-head {
            padding: 22px 24px;
            background: #ffc700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .brand-head b {
            font-size: 25px;
            line-height: 1;
            letter-spacing: -1px;
        }
        .brand-head b span {
            display: block;
        }
        .brand-head small {
            font-size: 10px;
            font-weight: 900;
            width: 115px;
        }

        .welcome-content {
            padding: 22px 22px 8px;
            flex: 1;
        }
        .eyebrow {
            font-weight: 900;
            font-size: 12px;
            margin-bottom: 6px;
        }
        .welcome-content h1 {
            font-weight: 900;
            font-size: 32px;
            line-height: 1.25;
            letter-spacing: -1.3px;
            margin-bottom: 16px;
        }

        .collab-poster {
            width: 100%;
            border-radius: 14px;
            display: block;
            object-fit: cover;
        }

        .start-order {
            background: #ffc700;
            margin: 8px 22px 0;
            padding: 17px 20px;
            border-radius: 12px;
            font-size: 19px;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
            cursor: pointer;
        }
        .start-order:hover {
            background: #ffd62d;
        }
        .welcome-note {
            text-align: center;
            color: #73694b;
            font-size: 10px;
            padding: 9px;
        }

        #kioskContainer > header {
            background: #fff !important;
            color: #171717 !important;
        }
        #categoryNav {
            background: #fff !important;
            border-color: #eee3bb !important;
            padding: 5px;
            gap: 3px;
        }
        #categoryNav button {
            color: #514b36 !important;
            border-radius: 7px;
            white-space: normal;
        }
        #categoryNav button:hover {
            background: #fff5c4;
        }
        #menuGridContainer {
            background: #fffdf5 !important;
            padding: 14px;
        }
        #menuGrid {
            gap: 10px;
        }
        #menuGrid > div {
            border-color: #e9e3cf;
            border-radius: 13px;
            padding: 10px;
        }
        #menuGrid h4 {
            font-size: 12px;
            line-height: 1.5;
        }
        #menuGrid img {
            background: #fff9e6;
            object-fit: cover;
        }

        .menu-photo {
            position: relative;
            overflow: hidden;
            width: 100%;
            margin: 6px 0 10px;
            border-radius: 8px;
            background: #f9f7ef;
        }

        @media(max-height: 760px) {
            .welcome-content { padding-top: 12px; }
            .welcome-content h1 { font-size: 25px; margin-bottom: 10px; }
            .collab-poster { max-height: 245px; object-fit: contain; }
            .brand-head { padding: 14px 22px; }
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 md:p-4">

    <!-- MAIN KIOSK CONTAINER FRAME -->
    <div id="kioskContainer" class="kiosk-frame w-full bg-white relative flex flex-col overflow-hidden md:rounded-3xl border-0 md:border-8 border-neutral-900 shadow-2xl transition-all duration-300">
        
        <!-- ========================================== -->
        <!-- SCREEN 0: WELCOME COVER SCREEN -->
        <!-- ========================================== -->
        <div id="screenWelcome" class="absolute inset-0 z-30 flex flex-col overflow-y-auto">
            <div class="brand-head">
                <b>No Brand<span>Burger</span></b>
                <small>WHY PAY MORE? IT’S GOOD ENOUGH.</small>
            </div>
            
            <section class="welcome-content">
                <p class="eyebrow">NBB × 먼작귀</p>
                <h1>오늘의 한 끼,<br>귀여움은 내 곁에!</h1>
                
                <!-- [IMAGE PLACEHOLDER 1] WELCOME BANNER / COLLAB POSTER -->
                <img id="imgWelcomePoster" class="collab-poster" src="https://via.placeholder.com/450x300?text=NBB+Collab+Poster+Image" alt="노브랜드 버거 콜라보 포스터">
            </section>

            <button onclick="startOrder()" class="start-order touch-active">
                <span>주문하기</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <p class="welcome-note">매장 이용 및 포장 주문이 가능합니다.</p>
        </div>

        <!-- ========================================== -->
        <!-- MAIN ORDER SCREEN -->
        <!-- ========================================== -->
        <header class="p-4 border-b flex justify-between items-center bg-white">
            <div class="font-bold text-xl tracking-tighter">
                <span class="text-yellow-500">No Brand</span> Burger
            </div>
            <div class="text-xs bg-yellow-100 px-3 py-1 rounded-full font-bold text-yellow-800">
                매장 식사 / 포장 선택
            </div>
        </header>

        <!-- CATEGORY NAVIGATION -->
        <nav id="categoryNav" class="flex border-b overflow-x-auto p-2 gap-1 bg-gray-50">
            <button onclick="filterCategory('all')" class="px-4 py-2 text-sm font-bold rounded-lg bg-nbb-yellow text-black whitespace-nowrap">전체메뉴</button>
            <button onclick="filterCategory('burger')" class="px-4 py-2 text-sm font-bold rounded-lg text-gray-600 whitespace-nowrap">버거</button>
            <button onclick="filterCategory('side')" class="px-4 py-2 text-sm font-bold rounded-lg text-gray-600 whitespace-nowrap">사이드</button>
            <button onclick="filterCategory('drink')" class="px-4 py-2 text-sm font-bold rounded-lg text-gray-600 whitespace-nowrap">음료</button>
        </nav>

        <!-- MENU GRID CONTAINER -->
        <main id="menuGridContainer" class="flex-1 overflow-y-auto p-4">
            <div id="menuGrid" class="grid grid-cols-2 gap-3">
                
                <!-- MENU ITEM 1 -->
                <div class="border rounded-xl p-3 bg-white flex flex-col justify-between shadow-sm">
                    <div>
                        <!-- [IMAGE PLACEHOLDER 2] MENU ITEM 1 -->
                        <div class="menu-photo">
                            <img id="imgMenu1" src="https://via.placeholder.com/200x150?text=NBB+Burger+1" alt="NBB 버거 1" class="w-full h-28 object-cover rounded-md">
                        </div>
                        <h4 class="font-bold text-sm">NBB 시그니처 버거</h4>
                        <p class="text-xs text-gray-500 mt-1">직화 패티와 진한 치즈의 풍미</p>
                    </div>
                    <div class="mt-3 flex justify-between items-center">
                        <span class="font-bold text-sm">₩4,800</span>
                        <button onclick="addToCart('NBB 시그니처 버거', 4800)" class="bg-nbb-yellow text-black text-xs font-bold px-2.5 py-1.5 rounded-md touch-active">+ 담기</button>
                    </div>
                </div>

                <!-- MENU ITEM 2 -->
                <div class="border rounded-xl p-3 bg-white flex flex-col justify-between shadow-sm">
                    <div>
                        <!-- [IMAGE PLACEHOLDER 3] MENU ITEM 2 -->
                        <div class="menu-photo">
                            <img id="imgMenu2" src="https://via.placeholder.com/200x150?text=NBB+Burger+2" alt="NBB 버거 2" class="w-full h-28 object-cover rounded-md">
                        </div>
                        <h4 class="font-bold text-sm">메가바이트 버거</h4>
                        <p class="text-xs text-gray-500 mt-1">바삭한 해쉬브라운이 통째로</p>
                    </div>
                    <div class="mt-3 flex justify-between items-center">
                        <span class="font-bold text-sm">₩5,000</span>
                        <button onclick="addToCart('메가바이트 버거', 5000)" class="bg-nbb-yellow text-black text-xs font-bold px-2.5 py-1.5 rounded-md touch-active">+ 담기</button>
                    </div>
                </div>

                <!-- MENU ITEM 3 -->
                <div class="border rounded-xl p-3 bg-white flex flex-col justify-between shadow-sm">
                    <div>
                        <!-- [IMAGE PLACEHOLDER 4] MENU ITEM 3 -->
                        <div class="menu-photo">
                            <img id="imgMenu3" src="https://via.placeholder.com/200x150?text=NBB+Side+1" alt="NBB 사이드 1" class="w-full h-28 object-cover rounded-md">
                        </div>
                        <h4 class="font-bold text-sm">감자튀김 (L)</h4>
                        <p class="text-xs text-gray-500 mt-1">두툼하고 고소한 감자튀김</p>
                    </div>
                    <div class="mt-3 flex justify-between items-center">
                        <span class="font-bold text-sm">₩2,100</span>
                        <button onclick="addToCart('감자튀김 (L)', 2100)" class="bg-nbb-yellow text-black text-xs font-bold px-2.5 py-1.5 rounded-md touch-active">+ 담기</button>
                    </div>
                </div>

                <!-- MENU ITEM 4 -->
                <div class="border rounded-xl p-3 bg-white flex flex-col justify-between shadow-sm">
                    <div>
                        <!-- [IMAGE PLACEHOLDER 5] MENU ITEM 4 -->
                        <div class="menu-photo">
                            <img id="imgMenu4" src="https://via.placeholder.com/200x150?text=NBB+Drink+1" alt="NBB 음료 1" class="w-full h-28 object-cover rounded-md">
                        </div>
                        <h4 class="font-bold text-sm">브랜드 콜라</h4>
                        <p class="text-xs text-gray-500 mt-1">노브랜드 버거 전용 콜라</p>
                    </div>
                    <div class="mt-3 flex justify-between items-center">
                        <span class="font-bold text-sm">₩1,700</span>
                        <button onclick="addToCart('브랜드 콜라', 1700)" class="bg-nbb-yellow text-black text-xs font-bold px-2.5 py-1.5 rounded-md touch-active">+ 담기</button>
                    </div>
                </div>

            </div>
        </main>

        <!-- FOOTER: CART & CHECKOUT -->
        <footer class="border-t bg-white p-4 shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <span class="font-bold text-sm">주문 내역 (<span id="cartCount">0</span>개)</span>
                <span class="font-extrabold text-lg text-black" id="totalPriceDisplay">₩0</span>
            </div>
            <div class="flex gap-2">
                <button onclick="clearCart()" class="w-1/3 py-3 border border-gray-300 rounded-xl font-bold text-sm text-gray-600 touch-active">전체취소</button>
                <button id="checkoutBtn" onclick="openCheckout()" disabled class="w-2/3 py-3 bg-nbb-yellow text-black rounded-xl font-extrabold text-base touch-active disabled:opacity-50">결제하기</button>
            </div>
        </footer>

    </div>

    <!-- SCRIPT FOR BASIC KIOSK INTERACTION -->
    <script>
        // Image Customization Guide Script:
        // You can change the image URLs below or directly modify the src attributes of the <img> elements above.
        const imageConfig = {
            welcomePoster: "https://via.placeholder.com/450x300?text=NBB+Collab+Poster+Image",
            menu1: "https://via.placeholder.com/200x150?text=NBB+Burger+1",
            menu2: "https://via.placeholder.com/200x150?text=NBB+Burger+2",
            menu3: "https://via.placeholder.com/200x150?text=NBB+Side+1",
            menu4: "https://via.placeholder.com/200x150?text=NBB+Drink+1"
        };

        function setImages() {
            if(document.getElementById('imgWelcomePoster')) document.getElementById('imgWelcomePoster').src = imageConfig.welcomePoster;
            if(document.getElementById('imgMenu1')) document.getElementById('imgMenu1').src = imageConfig.menu1;
            if(document.getElementById('imgMenu2')) document.getElementById('imgMenu2').src = imageConfig.menu2;
            if(document.getElementById('imgMenu3')) document.getElementById('imgMenu3').src = imageConfig.menu3;
            if(document.getElementById('imgMenu4')) document.getElementById('imgMenu4').src = imageConfig.menu4;
        }

        let cart = [];

        function startOrder() {
            document.getElementById('screenWelcome').classList.add('hidden');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function clearCart() {
            cart = [];
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);

            document.getElementById('cartCount').innerText = count;
            document.getElementById('totalPriceDisplay').innerText = '₩' + total.toLocaleString();

            const checkoutBtn = document.getElementById('checkoutBtn');
            if (count > 0) {
                checkoutBtn.removeAttribute('disabled');
            } else {
                checkoutBtn.setAttribute('disabled', 'true');
            }
        }

        function openCheckout() {
            if(cart.length === 0) return;
            alert('결제창으로 이동합니다. 총 금액: ₩' + cart.reduce((s, i) => s + i.price, 0).toLocaleString());
        }

        function filterCategory(cat) {
            // Placeholder function for category switching
            console.log('Filtered to category:', cat);
        }

        // Initialize custom images on load
        window.addEventListener('DOMContentLoaded', setImages);
    </script>
</body>
</html>
